; OBS Gauge — 1996 F-250 7.3L Powerstroke digital dash
;
; Envs:
;   obs-gauge-sim  — bench build, SIM_MODE drive-cycle data, no sensor hardware
;   obs-gauge-hw   — real sensors (ADS1115, MAX31855, IPR capture)
;   native         — host-side unit tests for the pure logic (scaling, alarms, sim)
;
; Platform is pioarduino (Arduino core 3.x on ESP-IDF 5.x) because the stock
; PlatformIO espressif32 platform is frozen at Arduino core 2.x, and we need
; the IDF 5.x esp_lcd component for the display path. See docs/decisions.md.

[platformio]
default_envs = obs-gauge-sim

[env]
test_framework = unity

[esp32s3_base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; Assumes an N16R8-class module (16 MB flash, 8 MB octal PSRAM). If your
; module is quad PSRAM, change memory_type to qio_qspi.
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
build_flags =
    -std=gnu++17
    -Wall
    -D BOARD_HAS_PSRAM
    -D LV_CONF_INCLUDE_SIMPLE
    -I include
lib_deps =
    lvgl/lvgl@^9.2.0

[env:obs-gauge-sim]
extends = esp32s3_base
build_flags =
    ${esp32s3_base.build_flags}
    -D SIM_MODE=1

[env:obs-gauge-hw]
extends = esp32s3_base

[env:native]
platform = native
build_flags =
    -std=gnu++17
    -Wall
    -I include
; Only the pure, framework-free modules build on host. Everything else
; (tasks, drivers, UI, state) is embedded-only.
build_src_filter =
    +<scaling/>
    +<alarms/>
    +<sim/>
